<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM Wiki — 只读视图</title>
<style>
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:14px;background:#fff;color:#1f2329}
  .banner{background:#0f172a;color:#fff;padding:10px 16px;font-size:13px;font-weight:600}
  .bar{background:#f1f5f9;border-bottom:1px solid #e2e8f0;padding:8px 16px;display:flex;gap:12px;align-items:center}
  .bar select{padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;min-width:180px}
  .pane{display:flex;height:calc(100vh - 90px)}
  .tree{flex:0 0 260px;overflow-y:auto;border-right:1px solid #e2e8f0;padding:10px;background:#fafbfc}
  .tree h3{font-size:12px;color:#6474a1;text-transform:uppercase;margin:0 0 8px}
  .tree ul{list-style:none;padding-left:14px;margin:4px 0}
  .tree li{margin:2px 0}
  .tree a{color:#334155;text-decoration:none;cursor:pointer}
  .tree a:hover{text-decoration:underline}
  .doc{flex:1;overflow-y:auto;padding:24px;max-width:900px;line-height:1.6}
  .doc h1{font-size:1.6em;margin-top:0}
  .doc h2{font-size:1.3em}
  .doc h3{font-size:1.1em}
  .doc a{color:#2563eb}
  .empty{color:#94a3b8;text-align:center}
</style>
</head>
<body>
  <div class="banner">只读视图 · 编辑请到主机</div>
  <div class="bar">
    <label>知识库：<select id="kbSelect" onchange="onKb()">
      <option value="">— 选择 —</option>
    </select></label>
  </div>
  <div class="pane">
    <div class="tree">
      <h3>目录</h3>
      <div id="tree" class="empty">先选择知识库</div>
    </div>
    <div class="doc" id="doc"><div class="empty">选择知识库浏览内容</div></div>
  </div>

<script>
/* share-ui：只读浏览，所有编辑链路都不存在（spec 03 §4） */
let treeData = [];

fetch('/api/kbs')
  .then(r => r.json())
  .then(d => {
    d.kbs.forEach(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = k;
      document.getElementById('kbSelect').appendChild(o);
    });
  });

function onKb() {
  const k = document.getElementById('kbSelect').value;
  document.getElementById('doc').innerHTML = '<div class="empty">加载中…</div>';
  if (!k) return;
  fetch('/api/tree?kb=' + encodeURIComponent(k))
    .then(r => r.json())
    .then(d => { treeData = d.tree || []; renderTree(treeData); });
}

function renderTree(nodes) {
  const el = document.getElementById('tree');
  if (!treeData.length) return el.innerHTML = '<div class="empty">空</div>';
  const k = document.getElementById('kbSelect').value;
  el.innerHTML = '<ul>' + renderItems(nodes, k) + '</ul>';
}

function renderItems(nodes, k) {
  return (nodes || []).map(n =>
    n.type === 'dir'
      ? '<li>📁 ' + n.name + (n.children && n.children.length ? renderChildren(n.children, k) : '') + '</li>'
      : '<li><a onclick="openFile(\'' + n.name + '\')">📄 ' + n.name + '</a></li>'
  ).join('');
}

function renderChildren(nodes, k) {
  return '<ul>' + renderItems(nodes, k) + '</ul>';
}

function openFile(name) {
  const k = document.getElementById('kbSelect').value;
  fetch('/api/file?kb=' + encodeURIComponent(k) + '&path=raw/sources/' + encodeURIComponent(name))
    .then(r => r.text())
    .then(md => {
      document.getElementById('doc').innerHTML = md
        .replace(/^###### (.+)/gm, '<h6>$1</h6>')
        .replace(/^##### (.+)/gm, '<h5>$1</h5>')
        .replace(/^#### (.+)/gm, '<h4>$1</h4>')
        .replace(/^### (.+)/gm, '<h3>$1</h3>')
        .replace(/^## (.+)/gm, '<h2>$1</h2>')
        .replace(/^# (.+)/gm, '<h1>$1</h1>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/^\- (.+)/gm, '<li>$1</li>')
        .replace(/\n/g, '<br/>');
    });
}
</script>
</body>
</html>
